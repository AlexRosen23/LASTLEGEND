name: Last Legend gameplay regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gameplay-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deterministic gameplay and character art
        run: |
          node tests/test_v4.cjs
          node tests/test_v5.cjs
          node tests/test_v6.cjs
          node tests/test_v7.cjs
          node tests/test_lineup_controls.cjs
          node tests/test_zone_v9.cjs
          node tests/test_encounters_v10.cjs
          node tests/test_profiles_v11.cjs
          node tests/test_choreography_v12.cjs
          node tests/test_strategy_v13.cjs
          node tests/test_polish_v14.cjs
          node tests/test_challenges_v15.cjs
          node tests/test_analytics_v16.cjs
          node tests/test_visual_rebirth_v18.cjs
          node tests/test_character_rebirth_v18.cjs
          node tests/test_battle_vision_v19.cjs
          node tests/test_encounter_cinema_v20.cjs
          node tests/test_survival_ai_v21.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser smoke-test runtime
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Desktop and phone Chromium V7 smoke tests
        run: |
          python tests/test_browser_v7.py
          python tests/test_browser_website_v8.py
          python tests/test_browser_visual_v18.py
          python tests/test_browser_battle_v19.py
          python tests/test_browser_cinema_v20.py
          python tests/test_browser_survival_v21.py
      - name: Upload V18 visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-visual-qa
          path: |
            reports/v18_visual_qa/*.png
            reports/v19_visual_qa/*.png
            reports/v20_visual_qa/*.png
          if-no-files-found: ignore
